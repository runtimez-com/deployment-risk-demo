apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-app.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "demo-app.name" . }}
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "demo-app.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "demo-app.name" . }}
    spec:
      {{- if .Values.security.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "demo-app.name" . }}
      {{- end }}
      securityContext:
        {{- if .Values.security.runAsNonRoot }}
        runAsNonRoot: true
        runAsUser: 1000
        {{- end }}
        seccompProfile:
          type: {{ .Values.security.seccompProfile }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              {{- if gt (int .Values.security.hostPort) 0 }}
              hostPort: {{ .Values.security.hostPort }}
              {{- end }}
          {{- if and .Values.probes.enabled (ne .Values.probes.readiness false) }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if and .Values.probes.enabled (ne .Values.probes.liveness false) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          securityContext:
            privileged: {{ .Values.security.privileged }}
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              {{- if .Values.security.dropAllCapabilities }}
              drop:
                - ALL
              {{- end }}
              {{- if .Values.security.addCapabilities }}
              add:
                {{- range .Values.security.addCapabilities }}
                - {{ . }}
                {{- end }}
              {{- end }}
