# Values for the demo app. Each demo PR changes a few of these lines.
nameOverride: web
image:
  tag: "1.4.2"
replicaCount: 1
probes:
  readiness: false
  liveness: true
resources:
  limits:
    memory: "256Mi"
pdb:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
service:
  enabled: true
  type: ClusterIP
ingress:
  enabled: true
  tls: true
networkPolicy:
  enabled: true
postgres:
  enabled: true
  image: postgres:15.8
  storage: 10Gi
